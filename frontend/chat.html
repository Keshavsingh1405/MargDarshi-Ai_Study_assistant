<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Tutor - Margdarshi</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script>
        (function() {
            const savedTheme = localStorage.getItem('theme') || 'light';
            document.documentElement.setAttribute('data-theme', savedTheme);
        })();
    </script>
    <link rel="stylesheet" href="css/variables.css">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        :root {
            --bg-page: #F8FAFC;
            --bg-card: #FFFFFF;
            --text-primary: #0F172A;
            --text-secondary: #475569;
            --text-muted: #94A3B8;
            --border-color: #E2E8F0;
            --border-hover: #CBD5E1;
            --primary-blue: #2563EB;
            --primary-hover: #1D4ED8;
            --primary-light: #EFF6FF;
            --primary-border: #BFDBFE;
            --radius-card: 14px;
            --radius-input: 10px;
            --shadow-subtle: 0 1px 3px 0 rgba(15, 23, 42, 0.05), 0 1px 2px -1px rgba(15, 23, 42, 0.03);
            --shadow-card: 0 4px 12px -2px rgba(15, 23, 42, 0.05), 0 2px 6px -2px rgba(15, 23, 42, 0.03);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-page);
            color: var(--text-primary);
            display: flex;
            height: 100vh;
            overflow: hidden;
            -webkit-font-smoothing: antialiased;
        }

        /* ── Sidebar ── */
        .sidebar {
            width: 240px;
            min-width: 240px;
            background: linear-gradient(180deg, #09132D 0%, #0D1C48 55%, #15358E 100%);
            color: #94A3B8;
            display: flex;
            flex-direction: column;
            padding: 1.5rem 1.15rem;
            flex-shrink: 0;
            position: relative;
            z-index: 50;
            transition: transform 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .sidebar-brand {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            color: white;
            font-size: 1.2rem;
            font-weight: 700;
            letter-spacing: -0.01em;
            margin-bottom: 2rem;
            padding: 0 0.5rem;
        }
        .sidebar-brand i { color: #60A5FA; }
        .sidebar-brand-tag {
            font-size: 10px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            background: rgba(96, 165, 250, 0.2);
            color: #93C5FD;
            padding: 2px 7px;
            border-radius: 4px;
            margin-left: auto;
        }
        .sidebar-nav {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 0.35rem;
        }
        .nav-item {
            display: flex;
            align-items: center;
            gap: 0.85rem;
            padding: 0.75rem 1rem;
            border-radius: 12px;
            color: rgba(255, 255, 255, 0.75);
            text-decoration: none;
            font-weight: 500;
            font-size: 0.92rem;
            transition: all 0.15s ease;
        }
        .nav-item:hover {
            color: white;
            background: rgba(255, 255, 255, 0.08);
        }
        .nav-item.active {
            background: #2563EB;
            color: white;
            font-weight: 600;
            box-shadow: 0 4px 14px rgba(37, 99, 235, 0.4);
        }
        .nav-item i { width: 19px; height: 19px; flex-shrink: 0; }

        .sidebar-user {
            display: flex;
            align-items: center;
            gap: 0.85rem;
            padding: 0.85rem 1rem;
            border-radius: 14px;
            margin-top: auto;
            cursor: pointer;
            transition: all 0.2s;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }
        .sidebar-user:hover { background: rgba(255, 255, 255, 0.1); }
        .sidebar-avatar {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            background: linear-gradient(135deg, #3B82F6, #1D4ED8);
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 0.95rem;
            flex-shrink: 0;
        }
        .sidebar-user-info { flex: 1; overflow: hidden; }
        .sidebar-user-name {
            font-size: 0.9rem;
            font-weight: 600;
            color: white;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .sidebar-user-role { font-size: 0.78rem; color: #94A3B8; }

        /* ── Mobile Overlay ── */
        .sidebar-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(15, 23, 42, 0.5);
            backdrop-filter: blur(2px);
            z-index: 45;
        }

        /* ── Main Area ── */
        .main-wrapper {
            flex: 1;
            width: calc(100% - 240px);
            min-width: 0;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
            background: var(--bg-page);
            position: relative;
        }

        /* ── Top Header ── */
        .top-header {
            padding: 1.25rem 28px;
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--bg-card);
            border-bottom: 1px solid var(--border-color);
            flex-shrink: 0;
            gap: 1.5rem;
        }
        .header-left {
            display: flex;
            align-items: center;
            gap: 1rem;
        }
        .header-title-block h1 {
            font-size: 1.65rem;
            font-weight: 700;
            color: var(--text-primary);
            letter-spacing: -0.025em;
            line-height: 1.2;
            margin-bottom: 4px;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        .header-title-block p {
            font-size: 0.92rem;
            color: var(--text-secondary);
        }
        .header-right {
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }
        .header-badge-ai {
            display: inline-flex;
            align-items: center;
            gap: 0.45rem;
            padding: 0.45rem 0.95rem;
            background: var(--primary-light);
            color: var(--primary-blue);
            border: 1px solid var(--primary-border);
            border-radius: 20px;
            font-size: 0.82rem;
            font-weight: 600;
        }
        .header-badge-ai span.pulse {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: #2563EB;
            box-shadow: 0 0 0 2px rgba(37, 99, 235, 0.25);
        }
        .menu-toggle-btn {
            display: none;
            width: 42px;
            height: 42px;
            border-radius: 10px;
            background: var(--bg-page);
            border: 1px solid var(--border-color);
            color: var(--text-primary);
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s;
        }
        .header-icon-btn {
            width: 42px;
            height: 42px;
            border-radius: 10px;
            background: var(--bg-page);
            border: 1px solid var(--border-color);
            color: var(--text-secondary);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            position: relative;
            transition: all 0.15s ease;
        }
        .header-icon-btn:hover {
            background: var(--border-hover);
            color: var(--text-primary);
            border-color: var(--border-hover);
        }
        .header-avatar {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            background: linear-gradient(135deg, #2563EB, #1D4ED8);
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 0.95rem;
            cursor: pointer;
            box-shadow: 0 2px 8px rgba(37, 99, 235, 0.25);
        }

        /* ── Chat Workspace Layout ── */
        .chat-workspace {
            flex: 1;
            display: flex;
            gap: 24px;
            padding: 24px 28px;
            overflow: hidden;
            width: 100%;
        }

        /* ── Left Context Panel ── */
        .context-panel {
            width: 310px;
            min-width: 310px;
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-card);
            box-shadow: var(--shadow-subtle);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        .context-panel-inner {
            padding: 1.25rem;
            display: flex;
            flex-direction: column;
            gap: 1.25rem;
            height: 100%;
            overflow-y: auto;
        }
        .context-panel-inner::-webkit-scrollbar { width: 5px; }
        .context-panel-inner::-webkit-scrollbar-thumb { background: #CBD5E1; border-radius: 10px; }

        /* New Chat Button */
        .btn-new-chat {
            background: linear-gradient(135deg, #2563EB 0%, #1D4ED8 100%);
            color: white;
            border: none;
            height: 48px;
            border-radius: var(--radius-input);
            font-weight: 600;
            font-size: 0.92rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            cursor: pointer;
            box-shadow: 0 4px 14px rgba(37, 99, 235, 0.25);
            transition: all 0.2s ease;
        }
        .btn-new-chat:hover {
            transform: translateY(-1px);
            box-shadow: 0 6px 18px rgba(37, 99, 235, 0.35);
        }

        /* Context Subsections */
        .context-sec-head {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 0.65rem;
        }
        .context-sec-title {
            font-size: 0.85rem;
            font-weight: 700;
            color: var(--text-primary);
            letter-spacing: -0.01em;
        }
        .btn-upload-link {
            font-size: 0.78rem;
            font-weight: 600;
            color: var(--primary-blue);
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 3px;
        }
        .btn-upload-link:hover { text-decoration: underline; }

        .doc-item-row {
            display: flex;
            align-items: center;
            gap: 0.65rem;
            padding: 0.55rem 0.75rem;
            border-radius: 8px;
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            margin-bottom: 0.45rem;
            transition: all 0.15s ease;
            cursor: pointer;
            user-select: none;
        }
        .doc-item-row:hover {
            background: var(--border-hover);
            border-color: var(--border-hover);
        }
        .doc-item-row.is-selected {
            background: var(--primary-light);
            border-color: var(--primary-border);
        }
        .doc-checkbox-pill {
            width: 18px;
            height: 18px;
            border-radius: 4px;
            border: 1.5px solid var(--border-color);
            background: var(--bg-page);
            color: transparent;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            transition: all 0.15s ease;
        }
        .doc-item-row.is-selected .doc-checkbox-pill {
            background: #2563EB;
            border-color: #2563EB;
            color: white;
        }
        .doc-item-name {
            font-size: 0.82rem;
            color: var(--text-primary);
            font-weight: 500;
            flex: 1;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* Context Selector Dropdown */
        .context-select-box {
            position: relative;
            width: 100%;
        }
        .context-select-box select {
            width: 100%;
            height: 44px;
            padding: 0 2.25rem 0 2.5rem;
            border: 1.5px solid var(--border-color);
            border-radius: var(--radius-input);
            background: var(--bg-card);
            color: var(--text-primary);
            font-size: 0.85rem;
            font-weight: 500;
            outline: none;
            appearance: none;
            cursor: pointer;
            transition: border-color 0.2s;
        }
        .context-select-box select:focus {
            border-color: var(--primary-blue);
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
        }
        .context-select-icon-left {
            position: absolute;
            left: 0.85rem;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
            pointer-events: none;
            width: 16px;
            height: 16px;
        }
        .context-select-icon-right {
            position: absolute;
            right: 0.85rem;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
            pointer-events: none;
            width: 16px;
            height: 16px;
        }

        /* Chat History List */
        .chat-group-tag {
            font-size: 0.72rem;
            font-weight: 700;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin: 0.75rem 0 0.4rem 0;
        }
        .chat-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0.65rem 0.85rem;
            border-radius: 10px;
            cursor: pointer;
            border-left: 3px solid transparent;
            transition: all 0.15s ease;
            position: relative;
        }
        .chat-item:hover {
            background: var(--border-hover);
        }
        .chat-item.active {
            background: var(--primary-light);
            border-left-color: var(--primary-blue);
        }
        .chat-item-left {
            display: flex;
            align-items: center;
            gap: 0.65rem;
            flex: 1;
            overflow: hidden;
        }
        .chat-item-title {
            font-size: 0.85rem;
            font-weight: 500;
            color: var(--text-primary);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .chat-item.active .chat-item-title {
            color: var(--primary-blue);
            font-weight: 600;
        }
        .chat-item-time {
            font-size: 0.72rem;
            color: var(--text-muted);
            flex-shrink: 0;
            transition: opacity 0.15s;
        }
        .chat-item-delete {
            color: #EF4444;
            cursor: pointer;
            opacity: 0;
            position: absolute;
            right: 0.85rem;
            transition: opacity 0.15s ease;
        }
        .chat-item:hover .chat-item-delete { opacity: 1; }
        .chat-item:hover .chat-item-time { opacity: 0; }

        /* ── Right AI Chat Workspace ── */
        .chat-arena {
            flex: 1;
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-card);
            box-shadow: var(--shadow-subtle);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            position: relative;
        }

        /* Context Notice Banner */
        .context-banner {
            margin: 1.15rem 1.5rem 0 1.5rem;
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            padding: 0.65rem 1rem;
            border-radius: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.82rem;
            color: var(--text-secondary);
            font-weight: 500;
            z-index: 2;
        }

        /* Messages Scroll Container */
        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 1.5rem 2rem;
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
            z-index: 1;
        }
        .chat-messages::-webkit-scrollbar { width: 6px; }
        .chat-messages::-webkit-scrollbar-thumb { background: #CBD5E1; border-radius: 10px; }

        /* Empty State */
        .empty-state {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            height: 100%;
            padding: 1.5rem;
        }
        .empty-hero-icon {
            width: 58px;
            height: 58px;
            border-radius: 16px;
            background: var(--primary-light);
            color: var(--primary-blue);
            border: 1px solid var(--primary-border);
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 1.25rem;
            box-shadow: 0 4px 12px rgba(37, 99, 235, 0.15);
        }
        .empty-title {
            font-size: 2.1rem;
            font-weight: 800;
            color: var(--text-primary);
            line-height: 1.2;
            letter-spacing: -0.025em;
            margin-bottom: 0.65rem;
        }
        .empty-title span {
            color: var(--primary-blue);
        }
        .empty-subtitle {
            color: var(--text-secondary);
            font-size: 0.95rem;
            max-width: 540px;
            line-height: 1.55;
            margin-bottom: 2rem;
        }

        .suggestions-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 14px;
            width: 100%;
            max-width: 700px;
        }
        .suggestion-card {
            background: var(--bg-card);
            border: 1.5px solid var(--border-color);
            padding: 1rem 1.15rem;
            border-radius: 12px;
            display: flex;
            align-items: center;
            gap: 0.85rem;
            cursor: pointer;
            box-shadow: var(--shadow-subtle);
            text-align: left;
            transition: all 0.2s ease;
        }
        .suggestion-card:hover {
            transform: translateY(-2px);
            border-color: var(--primary-blue);
            box-shadow: var(--shadow-card);
        }
        .sugg-icon-box {
            width: 38px;
            height: 38px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }
        .sugg-text {
            font-size: 0.88rem;
            font-weight: 600;
            color: var(--text-primary);
            line-height: 1.35;
            flex: 1;
        }
        .sugg-arrow {
            color: var(--text-muted);
            width: 16px;
            height: 16px;
            flex-shrink: 0;
        }

        /* Message Bubbles */
        .msg-row {
            display: flex;
            gap: 0.85rem;
            max-width: 82%;
            animation: slideIn 0.25s ease-out;
        }
        .msg-row.user {
            align-self: flex-end;
            flex-direction: row-reverse;
        }
        .msg-avatar {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }
        .msg-avatar.ai {
            background: var(--primary-light);
            color: var(--primary-blue);
            border: 1px solid var(--primary-border);
        }
        .msg-avatar.user {
            background: linear-gradient(135deg, #2563EB, #1D4ED8);
            color: white;
        }

        .msg-bubble {
            padding: 1.1rem 1.35rem;
            border-radius: 14px;
            font-size: 0.92rem;
            line-height: 1.6;
        }
        .msg-bubble.ai {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-top-left-radius: 4px;
            color: var(--text-primary);
        }
        .msg-bubble.user {
            background: linear-gradient(135deg, #2563EB 0%, #1D4ED8 100%);
            color: white;
            border-top-right-radius: 4px;
            box-shadow: 0 4px 14px rgba(37, 99, 235, 0.2);
        }

        /* Chat Input Container */
        .chat-input-container {
            padding: 1.15rem 1.75rem;
            border-top: 1px solid var(--border-color);
            background: var(--bg-card);
            z-index: 2;
        }
        .chat-input-wrapper {
            background: var(--bg-page);
            border: 1.5px solid var(--border-color);
            border-radius: var(--radius-input);
            display: flex;
            align-items: center;
            padding: 0 0.5rem 0 1rem;
            transition: all 0.2s ease;
            height: 52px;
        }
        .chat-input-wrapper:focus-within {
            border-color: var(--primary-blue);
            background: var(--bg-card);
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.12);
        }
        .chat-input {
            flex: 1;
            border: none;
            outline: none;
            background: transparent;
            font-size: 0.92rem;
            color: var(--text-primary);
            margin: 0 0.75rem;
            font-family: inherit;
        }
        .input-icon-btn {
            color: var(--text-muted);
            cursor: pointer;
            width: 20px;
            height: 20px;
            transition: color 0.15s;
        }
        .input-icon-btn:hover { color: var(--text-primary); }
        .btn-send {
            background: linear-gradient(135deg, #2563EB 0%, #1D4ED8 100%);
            border: none;
            width: 40px;
            height: 40px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 3px 10px rgba(37, 99, 235, 0.25);
        }
        .btn-send:hover {
            transform: scale(1.04);
            box-shadow: 0 5px 14px rgba(37, 99, 235, 0.35);
        }

        @keyframes slideIn {
            from { opacity: 0; transform: translateY(6px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Responsive Breakpoints */
        @media (max-width: 1024px) {
            .chat-workspace { padding: 1rem; gap: 1rem; }
            .context-panel { width: 260px; min-width: 260px; }
            .suggestions-grid { grid-template-columns: 1fr; }
        }
        @media (max-width: 768px) {
            .sidebar {
                position: fixed;
                top: 0;
                bottom: 0;
                left: 0;
                transform: translateX(-100%);
            }
            .main-wrapper { width: 100%; }
            .sidebar.mobile-open { transform: translateX(0); }
            .sidebar-overlay.mobile-open { display: block; }
            .menu-toggle-btn { display: flex; }
            .chat-workspace { flex-direction: column; }
            .context-panel { width: 100%; min-width: 0; max-height: 200px; }
            .top-header { padding: 1rem; }
            .header-badge-ai { display: none; }
        }
    </style>
</head>
<body>
    <div style="display: flex; width: 100%; height: 100%;">
        <!-- Mobile Sidebar Backdrop -->
        <div class="sidebar-overlay" id="sidebar-overlay"></div>

        <!-- Sidebar -->
        <aside class="sidebar" id="sidebar-container"></aside>

        <!-- Main Wrapper -->
        <div class="main-wrapper">
            <!-- Top Header -->
            <header class="top-header">
                <div class="header-left">
                    <button class="menu-toggle-btn" id="menu-toggle-btn" title="Toggle navigation">
                        <i data-lucide="menu" style="width: 22px; height: 22px;"></i>
                    </button>
                    <div class="header-title-block">
                        <h1>AI Tutor <i data-lucide="sparkles" style="width: 22px; height: 22px; color: #2563EB;"></i></h1>
                        <p>Your personal study assistant, powered by your notes and documents.</p>
                    </div>
                </div>
                <div class="header-right">
                    <div class="header-badge-ai">
                        <span class="pulse"></span>
                        Gemini &bull; Context Aware
                    </div>
                    <button class="header-icon-btn dark-mode-toggle" id="theme-toggle-btn" title="Toggle theme">
                        <i data-lucide="moon" id="theme-toggle-icon" style="width: 18px; height: 18px;"></i>
                    </button>
                    <div class="header-avatar" id="header-user-avatar" style="cursor: pointer;" onclick="window.location.href='profile.html'">K</div>
                </div>
            </header>

            <!-- Chat Workspace -->
            <div class="chat-workspace">
                <!-- Left Context Panel -->
                <div class="context-panel">
                    <div class="context-panel-inner">
                        <button class="btn-new-chat" id="new-chat-btn">
                            <i data-lucide="plus" style="width: 18px; height: 18px;"></i>
                            <span>New Chat</span>
                        </button>

                        <div>
                            <div class="context-sec-head">
                                <span class="context-sec-title">Your Documents</span>
                                <a href="documents.html" class="btn-upload-link"><i data-lucide="upload" style="width: 13px; height: 13px;"></i> Upload</a>
                            </div>
                            <div id="document-list" style="display: flex; flex-direction: column; max-height: 190px; overflow-y: auto; padding-right: 2px;">
                                <div style="font-size: 0.82rem; color: var(--text-muted); padding: 0.5rem 0;">Loading documents...</div>
                            </div>
                        </div>

                        <div>
                            <div class="context-sec-head" style="margin-bottom: 0.5rem;">
                                <span class="context-sec-title">Select Context</span>
                            </div>
                            <div class="context-select-box">
                                <i data-lucide="book-open" class="context-select-icon-left"></i>
                                <select id="context-select">
                                    <option value="all">All Documents</option>
                                    <option value="selected">Selected Documents</option>
                                </select>
                                <i data-lucide="chevron-down" class="context-select-icon-right"></i>
                            </div>
                            <div id="selected-context-info" style="margin-top: 0.45rem; font-size: 0.76rem; color: var(--text-secondary); line-height: 1.35; display: flex; align-items: center; gap: 0.35rem;">
                                <i data-lucide="info" style="width: 13px; height: 13px; flex-shrink: 0; color: #2563EB;"></i>
                                <span id="selected-context-text">All Documents active</span>
                            </div>
                        </div>

                        <div style="flex: 1; display: flex; flex-direction: column; overflow: hidden; margin-top: 0.25rem;">
                            <div class="context-sec-head" style="margin-bottom: 0;">
                                <span class="context-sec-title">Chat History</span>
                                <i data-lucide="search" style="width: 15px; height: 15px; color: var(--text-muted); cursor: pointer;"></i>
                            </div>
                            <div id="chat-list" style="flex: 1; overflow-y: auto; padding-right: 0.25rem; margin-top: 0.5rem;">
                                <div style="font-size: 0.82rem; color: var(--text-muted); padding: 0.5rem 0;">Loading chats...</div>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Right Chat Arena -->
                <div class="chat-arena">
                    <div class="context-banner" id="context-banner">
                        <div style="display: flex; align-items: center; gap: 0.5rem;" id="context-banner-text">
                            <i data-lucide="lightbulb" style="width: 16px; height: 16px; color: #2563EB;"></i>
                            <span>Use your uploaded documents as context to get personalized answers.</span>
                        </div>
                        <i data-lucide="x" style="width: 15px; height: 15px; cursor: pointer; color: var(--text-muted);" onclick="document.getElementById('context-banner').style.display='none'"></i>
                    </div>

                    <div class="chat-messages" id="chat-messages">
                        <!-- Dynamic Messages or Empty State -->
                    </div>

                    <div class="chat-input-container">
                        <form class="chat-input-wrapper" id="chat-form">
                            <i data-lucide="paperclip" class="input-icon-btn" title="Add notes from documents" onclick="window.location.href='documents.html'"></i>
                            <input type="text" class="chat-input" id="chat-input" placeholder="Ask anything about your notes..." required>
                            <i data-lucide="image" class="input-icon-btn" title="Upload lecture diagram or slide" onclick="window.location.href='documents.html'" style="margin-right: 0.65rem;"></i>
                            <i data-lucide="mic" class="input-icon-btn" id="mic-btn" title="Voice dictation" onclick="window.toggleSpeech()" style="margin-right: 0.85rem;"></i>
                            <button type="submit" class="btn-send"><i data-lucide="send" style="width: 16px; height: 16px; margin-left: 1px;"></i></button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Reusable Sidebar injection and Page Logic -->
    <script type="module">
        import { checkAuth, logout } from './js/auth.js';
        import { apiFetch } from './js/api.js';

        let currentChatId = null;
        let allDocuments = [];
        const selectedDocumentIds = new Set();
        let currentContextMode = 'all'; // 'all' or 'selected'

        window.setChatInput = (text) => {
            const input = document.getElementById('chat-input');
            input.value = text;
            input.focus();
        };

        window.copyMsg = (btn) => {
            const bubble = btn.closest('.msg-bubble');
            if (!bubble) return;
            const textEl = bubble.querySelector('div:first-child');
            const text = textEl ? textEl.innerText : '';
            if (navigator.clipboard) {
                navigator.clipboard.writeText(text).then(() => {
                    const original = btn.innerHTML;
                    btn.innerHTML = '<i data-lucide="check" style="width: 13px; height: 13px; color: #10B981;"></i> Copied!';
                    if (window.lucide) lucide.createIcons();
                    setTimeout(() => {
                        btn.innerHTML = original;
                        if (window.lucide) lucide.createIcons();
                    }, 2000);
                });
            }
        };

        window.toggleFeedback = (btn, type) => {
            const container = btn.parentElement;
            const isAlreadyActive = btn.classList.contains('active');
            container.querySelectorAll('.feedback-btn').forEach(b => {
                b.classList.remove('active');
            });
            if (!isAlreadyActive) {
                btn.classList.add('active');
            }
        };

        let recognition = null;
        window.toggleSpeech = () => {
            const SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition;
            const micBtn = document.getElementById('mic-btn');
            if (!SpeechRec) {
                alert('Speech recognition is not supported in this browser.');
                return;
            }
            if (!recognition) {
                recognition = new SpeechRec();
                recognition.continuous = false;
                recognition.interimResults = false;
                recognition.onstart = () => {
                    if (micBtn) {
                        micBtn.style.color = '#EF4444';
                        micBtn.style.transform = 'scale(1.2)';
                    }
                };
                recognition.onresult = (event) => {
                    const transcript = event.results[0][0].transcript;
                    const input = document.getElementById('chat-input');
                    if (input) {
                        input.value = (input.value ? input.value + ' ' : '') + transcript;
                        input.focus();
                    }
                };
                recognition.onend = () => {
                    if (micBtn) {
                        micBtn.style.color = '';
                        micBtn.style.transform = '';
                    }
                };
                recognition.onerror = () => {
                    if (micBtn) {
                        micBtn.style.color = '';
                        micBtn.style.transform = '';
                    }
                };
            }
            try {
                recognition.start();
            } catch(e) {
                recognition.stop();
            }
        };

        window.deleteChat = async (id) => {
            if (!confirm('Are you sure you want to delete this chat?')) return;
            try {
                await apiFetch('/chats/' + id, { method: 'DELETE' });
                if (currentChatId === id) {
                    currentChatId = null;
                    document.getElementById('chat-messages').innerHTML = getEmptyStateHTML();
                }
                loadChats();
            } catch(e) {
                console.error(e);
                alert('Failed to delete chat');
            }
        };

        const renderSidebar = () => {
            const sidebar = document.getElementById('sidebar-container');
            const path = window.location.pathname;
            sidebar.innerHTML = `
                <div class="sidebar-brand">
                    <i data-lucide="graduation-cap"></i> Margdarshi
                    <span class="sidebar-brand-tag">AI</span>
                </div>
                <nav class="sidebar-nav">
                    <a href="dashboard.html" class="nav-item ${path.includes('dashboard') ? 'active' : ''}"><i data-lucide="layout-dashboard"></i> Dashboard</a>
                    <a href="chat.html" class="nav-item ${path.includes('chat') ? 'active' : ''}"><i data-lucide="message-square"></i> AI Tutor</a>
                    <a href="documents.html" class="nav-item ${path.includes('documents') ? 'active' : ''}"><i data-lucide="file-text"></i> My Documents</a>
                    <a href="quizzes.html" class="nav-item ${path.includes('quizzes') ? 'active' : ''}"><i data-lucide="check-circle"></i> Quizzes</a>
                    <a href="flashcards.html" class="nav-item ${path.includes('flashcards') ? 'active' : ''}"><i data-lucide="layers"></i> Flashcards</a>
                    <a href="planner.html" class="nav-item ${path.includes('planner') ? 'active' : ''}"><i data-lucide="calendar"></i> Study Planner</a>
                    <a href="progress.html" class="nav-item ${path.includes('progress') ? 'active' : ''}"><i data-lucide="trending-up"></i> Progress</a>
                </nav>
                <div class="sidebar-user" onclick="window.location.href='profile.html'">
                    <div class="sidebar-avatar" id="sidebar-user-initial">K</div>
                    <div class="sidebar-user-info">
                        <div class="sidebar-user-name" id="sidebar-user-name">Loading...</div>
                        <div class="sidebar-user-role">Student</div>
                    </div>
                </div>
            `;
            lucide.createIcons();
        };

        const renderDocumentsUI = () => {
            const docList = document.getElementById('document-list');
            if (!docList) return;

            if (allDocuments.length === 0) {
                docList.innerHTML = '<div style="font-size: 0.82rem; color: var(--text-muted); padding: 0.5rem 0;">No documents found.</div>';
                return;
            }

            docList.innerHTML = allDocuments.map(doc => {
                const docId = doc._id.toString();
                const isSelected = selectedDocumentIds.has(docId);
                return `
                    <div class="doc-item-row ${isSelected ? 'is-selected' : ''}" 
                         data-document-id="${docId}" 
                         title="Click to ${isSelected ? 'deselect' : 'select'} ${doc.originalName}">
                        <div class="doc-checkbox-pill" data-document-id="${docId}">
                            <i data-lucide="check" style="width: 12px; height: 12px; display: ${isSelected ? 'block' : 'none'};"></i>
                        </div>
                        <span class="doc-item-name" title="${doc.originalName}">${doc.originalName}</span>
                        <i data-lucide="file-text" style="width: 14px; height: 14px; color: ${isSelected ? '#2563EB' : 'var(--text-muted)'}; flex-shrink: 0;"></i>
                    </div>
                `;
            }).join('');

            docList.querySelectorAll('.doc-item-row').forEach(row => {
                row.addEventListener('click', () => {
                    const docId = row.dataset.documentId;
                    toggleDocumentSelection(docId);
                });
            });

            lucide.createIcons();
        };

        const toggleDocumentSelection = (docId) => {
            if (!docId) return;

            if (selectedDocumentIds.has(docId)) {
                selectedDocumentIds.delete(docId);
            } else {
                selectedDocumentIds.add(docId);
            }

            // Sync context mode: if all documents are checked, mode is 'all'; otherwise 'selected'
            if (selectedDocumentIds.size === allDocuments.length && allDocuments.length > 0) {
                currentContextMode = 'all';
                const contextSelect = document.getElementById('context-select');
                if (contextSelect) contextSelect.value = 'all';
            } else {
                currentContextMode = 'selected';
                const contextSelect = document.getElementById('context-select');
                if (contextSelect) contextSelect.value = 'selected';
            }

            renderDocumentsUI();
            updateContextSummary();
        };

        const updateContextSummary = () => {
            const summaryText = document.getElementById('selected-context-text');
            const bannerText = document.getElementById('context-banner-text');
            const banner = document.getElementById('context-banner');

            if (currentContextMode === 'all') {
                const count = allDocuments.length;
                if (summaryText) {
                    summaryText.innerHTML = `<span><strong>All Documents</strong> (${count} active)</span>`;
                    summaryText.style.color = 'var(--text-secondary)';
                }
                if (bannerText) {
                    bannerText.innerHTML = `
                        <i data-lucide="lightbulb" style="width: 16px; height: 16px; color: #2563EB; flex-shrink: 0;"></i>
                        <span><strong>Active Context:</strong> All ${count} documents are available as AI context.</span>
                    `;
                }
                if (banner) banner.style.display = 'flex';
            } else {
                const count = selectedDocumentIds.size;
                const selectedDocs = allDocuments.filter(d => selectedDocumentIds.has(d._id.toString()));
                const docNames = selectedDocs.map(d => d.originalName).join(', ');

                if (count === 0) {
                    if (summaryText) {
                        summaryText.innerHTML = `<span style="color: #EF4444; font-weight: 600;">No documents selected</span>`;
                    }
                    if (bannerText) {
                        bannerText.innerHTML = `
                            <i data-lucide="alert-circle" style="width: 16px; height: 16px; color: #EF4444; flex-shrink: 0;"></i>
                            <span style="color: #B91C1C;"><strong>Notice:</strong> No documents selected. AI will answer without course notes context.</span>
                        `;
                    }
                    if (banner) banner.style.display = 'flex';
                } else {
                    if (summaryText) {
                        summaryText.innerHTML = `<span><strong style="color: #1D4ED8;">${count} document${count > 1 ? 's' : ''} selected</strong></span>`;
                    }
                    if (bannerText) {
                        bannerText.innerHTML = `
                            <i data-lucide="check-circle-2" style="width: 16px; height: 16px; color: #2563EB; flex-shrink: 0;"></i>
                            <span><strong>Active Context (${count}):</strong> ${docNames}</span>
                        `;
                    }
                    if (banner) banner.style.display = 'flex';
                }
            }
            lucide.createIcons();
        };

        const loadDocumentsList = async () => {
            try {
                const res = await apiFetch('/documents');
                allDocuments = res.data || [];
                
                // If in 'all' mode, populate selectedDocumentIds so all checkboxes show checked
                if (currentContextMode === 'all') {
                    selectedDocumentIds.clear();
                    allDocuments.forEach(d => selectedDocumentIds.add(d._id.toString()));
                }

                renderDocumentsUI();
                updateContextSummary();
            } catch(e) { 
                console.error('Failed to load documents:', e); 
            }
        };

        const loadChats = async () => {
            try {
                const res = await apiFetch('/chats');
                const chatList = document.getElementById('chat-list');
                
                if (res.data && res.data.length > 0) {
                    let html = '';
                    const today = new Date();
                    today.setHours(0,0,0,0);
                    
                    let todayChats = [];
                    let olderChats = [];
                    
                    res.data.forEach(c => {
                        const d = new Date(c.updatedAt);
                        if (d >= today) todayChats.push(c);
                        else olderChats.push(c);
                    });
                    
                    if(todayChats.length > 0) {
                        html += `<div class="chat-group-tag">Today</div>`;
                        html += todayChats.map(c => renderChatListItem(c, true)).join('');
                    }
                    
                    if(olderChats.length > 0) {
                        html += `<div class="chat-group-tag" style="margin-top: 1rem;">Previous 7 Days</div>`;
                        html += olderChats.map(c => renderChatListItem(c, false)).join('');
                    }
                    
                    chatList.innerHTML = html;
                    
                    document.querySelectorAll('.chat-item').forEach(el => {
                        el.addEventListener('click', (e) => {
                            if (e.target.closest('.chat-item-delete')) {
                                e.stopPropagation();
                                deleteChat(el.dataset.id);
                            } else {
                                loadChatHistory(el.dataset.id);
                            }
                        });
                    });
                } else {
                    chatList.innerHTML = '<div style="font-size: 0.82rem; color: var(--text-muted); padding: 0.5rem 0;">No chats yet.</div>';
                }
                lucide.createIcons();
            } catch(e) { console.error(e); }
        };
        
        function renderChatListItem(c, isToday) {
            const d = new Date(c.updatedAt);
            const timeStr = isToday ? d.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'}) : d.toLocaleDateString([], {month: 'short', day: 'numeric'});
            const isActive = c._id === currentChatId;
            
            return `
                <div class="chat-item ${isActive ? 'active' : ''}" data-id="${c._id}">
                    <div class="chat-item-left">
                        <i data-lucide="message-square" style="width: 15px; height: 15px; color: ${isActive ? '#2563EB' : '#94A3B8'};"></i>
                        <span class="chat-item-title">${c.title}</span>
                    </div>
                    <span class="chat-item-time">${timeStr}</span>
                    <i data-lucide="trash-2" class="chat-item-delete" style="width: 15px; height: 15px;"></i>
                </div>
            `;
        }

        const getEmptyStateHTML = () => {
            return `
                <div class="empty-state" id="empty-state">
                    <div class="empty-hero-icon">
                        <i data-lucide="sparkles" style="width: 30px; height: 30px;"></i>
                    </div>
                    
                    <h2 class="empty-title">How can I help you <span>study today? ✨</span></h2>
                    <p class="empty-subtitle">Explain concepts, summarize your documents, generate quizzes, and prepare for exams.</p>
                    
                    <div class="suggestions-grid">
                        <div class="suggestion-card" onclick="setChatInput('Explain software engineering simply.')">
                            <div class="sugg-icon-box blue" style="background: #EFF6FF; color: #2563EB;"><i data-lucide="file-text" style="width: 18px; height: 18px;"></i></div>
                            <div class="sugg-text">Explain Software Engineering simply</div>
                            <i data-lucide="arrow-right" class="sugg-arrow"></i>
                        </div>
                        
                        <div class="suggestion-card" onclick="setChatInput('Summarize my uploaded document.')">
                            <div class="sugg-icon-box purple" style="background: #F5F3FF; color: #7C3AED;"><i data-lucide="book-open" style="width: 18px; height: 18px;"></i></div>
                            <div class="sugg-text">Summarize my uploaded document</div>
                            <i data-lucide="arrow-right" class="sugg-arrow"></i>
                        </div>
                        
                        <div class="suggestion-card" onclick="setChatInput('Generate quiz questions from notes.')">
                            <div class="sugg-icon-box green" style="background: #ECFDF5; color: #10B981;"><i data-lucide="check-circle" style="width: 18px; height: 18px;"></i></div>
                            <div class="sugg-text">Generate quiz questions from notes</div>
                            <i data-lucide="arrow-right" class="sugg-arrow"></i>
                        </div>
                        
                        <div class="suggestion-card" onclick="setChatInput('Compare two key concepts in my course.')">
                            <div class="sugg-icon-box orange" style="background: #FFFBEB; color: #D97706;"><i data-lucide="git-merge" style="width: 18px; height: 18px;"></i></div>
                            <div class="sugg-text">Compare two key concepts</div>
                            <i data-lucide="arrow-right" class="sugg-arrow"></i>
                        </div>
                    </div>
                </div>
            `;
        };

        const loadChatHistory = async (id) => {
            currentChatId = id;
            try {
                const res = await apiFetch('/chats/' + id);
                const { chat, messages } = res.data;

                // Restore document selection if chat has specific associated documents
                selectedDocumentIds.clear();
                if (chat && chat.documents && chat.documents.length > 0 && chat.documents.length < allDocuments.length) {
                    chat.documents.forEach(doc => {
                        const docId = (typeof doc === 'object' && doc._id) ? doc._id.toString() : doc.toString();
                        selectedDocumentIds.add(docId);
                    });
                    currentContextMode = 'selected';
                    const contextSelect = document.getElementById('context-select');
                    if (contextSelect) contextSelect.value = 'selected';
                } else {
                    currentContextMode = 'all';
                    allDocuments.forEach(d => selectedDocumentIds.add(d._id.toString()));
                    const contextSelect = document.getElementById('context-select');
                    if (contextSelect) contextSelect.value = 'all';
                }
                renderDocumentsUI();
                updateContextSummary();
                
                const messagesContainer = document.getElementById('chat-messages');
                if (messages.length === 0) {
                    messagesContainer.innerHTML = getEmptyStateHTML();
                } else {
                    messagesContainer.innerHTML = messages.map(m => renderMessageHTML(m)).join('');
                    messagesContainer.scrollTop = messagesContainer.scrollHeight;
                }
                lucide.createIcons();
                loadChats(); 
            } catch(e) { console.error(e); }
        };
        
        function renderMessageHTML(m) {
            const isUser = m.role === 'user';
            return `
                <div class="msg-row ${isUser ? 'user' : 'ai'}">
                    <div class="msg-avatar ${isUser ? 'user' : 'ai'}">
                        ${isUser ? '<i data-lucide="user" style="width: 18px; height: 18px;"></i>' : '<i data-lucide="bot" style="width: 18px; height: 18px;"></i>'}
                    </div>
                    <div class="msg-bubble ${isUser ? 'user' : 'ai'}">
                        <div>${m.content.replace(/\n/g, '<br>')}</div>
                        ${m.sources && m.sources.length > 0 ? `
                            <div style="margin-top: 0.85rem; border-top: 1px solid var(--border-color); padding-top: 0.65rem;">
                                <strong style="font-size: 0.8rem; color: var(--text-secondary);">Sources:</strong><br>
                                <div style="display: flex; gap: 0.4rem; flex-wrap: wrap; margin-top: 0.4rem;">
                                    ${m.sources.map(s => `<div class="rag-source-pill" style="font-size: 0.78rem; background: #EFF6FF; color: #2563EB; border: 1px solid #BFDBFE; padding: 0.25rem 0.65rem; border-radius: 20px; display: inline-flex; align-items: center; gap: 0.35rem; font-weight: 600;"><i data-lucide="file-text" style="width: 12px; height: 12px;"></i> ${s.documentName} (Pg: ${s.page})</div>`).join('')}
                                </div>
                            </div>
                        ` : ''}
                        ${!isUser ? `
                            <div style="margin-top: 0.85rem; display: flex; gap: 0.4rem; align-items: center;">
                                <button type="button" class="feedback-btn copy-btn" onclick="window.copyMsg(this)" style="background: transparent; border: none; color: var(--text-muted); cursor: pointer; display: flex; align-items: center; gap: 0.25rem; font-size: 0.8rem; padding: 0.25rem 0.5rem; border-radius: 6px; transition: 0.15s;"><i data-lucide="copy" style="width: 13px; height: 13px;"></i> Copy</button>
                                <button type="button" class="feedback-btn like" onclick="window.toggleFeedback(this, 'like')" style="background: transparent; border: none; color: var(--text-muted); cursor: pointer; display: flex; align-items: center; gap: 0.25rem; padding: 0.25rem 0.5rem; border-radius: 6px; transition: 0.15s;"><i data-lucide="thumbs-up" style="width: 13px; height: 13px;"></i></button>
                                <button type="button" class="feedback-btn dislike" onclick="window.toggleFeedback(this, 'dislike')" style="background: transparent; border: none; color: var(--text-muted); cursor: pointer; display: flex; align-items: center; gap: 0.25rem; padding: 0.25rem 0.5rem; border-radius: 6px; transition: 0.15s;"><i data-lucide="thumbs-down" style="width: 13px; height: 13px;"></i></button>
                            </div>
                        ` : ''}
                    </div>
                </div>
            `;
        }

        document.getElementById('new-chat-btn').addEventListener('click', async () => {
            try {
                const res = await apiFetch('/chats', { method: 'POST' });
                currentChatId = res.data._id;
                document.getElementById('chat-messages').innerHTML = getEmptyStateHTML();
                selectedDocumentIds.clear();
                allDocuments.forEach(d => selectedDocumentIds.add(d._id.toString()));
                currentContextMode = 'all';
                const contextSelect = document.getElementById('context-select');
                if (contextSelect) contextSelect.value = 'all';
                renderDocumentsUI();
                updateContextSummary();
                lucide.createIcons();
                loadChats();
            } catch(e) { console.error(e); }
        });

        document.getElementById('chat-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const input = document.getElementById('chat-input');
            const content = input.value.trim();
            if (!content) return;
            
            if (!currentChatId) {
                const res = await apiFetch('/chats', { method: 'POST', body: JSON.stringify({ title: content.substring(0, 30) }) });
                currentChatId = res.data._id;
            }

            const messagesContainer = document.getElementById('chat-messages');
            if (document.getElementById('empty-state')) {
                messagesContainer.innerHTML = '';
            }
            
            const userMsgHtml = renderMessageHTML({ role: 'user', content: content });
            messagesContainer.insertAdjacentHTML('beforeend', userMsgHtml);
            input.value = '';
            messagesContainer.scrollTop = messagesContainer.scrollHeight;
            lucide.createIcons();

            const loadingId = 'loading-' + Date.now();
            messagesContainer.insertAdjacentHTML('beforeend', `
                <div class="msg-row ai" id="${loadingId}">
                    <div class="msg-avatar ai"><i data-lucide="bot" style="width: 18px; height: 18px;"></i></div>
                    <div class="msg-bubble ai" style="display: flex; gap: 0.5rem; align-items: center;">
                        <span style="display: flex; gap: 0.3rem;">
                            <span style="width: 6px; height: 6px; background: #2563EB; border-radius: 50%; animation: bounce 1.4s infinite ease-in-out both;"></span>
                            <span style="width: 6px; height: 6px; background: #2563EB; border-radius: 50%; animation: bounce 1.4s infinite ease-in-out both; animation-delay: 0.16s;"></span>
                            <span style="width: 6px; height: 6px; background: #2563EB; border-radius: 50%; animation: bounce 1.4s infinite ease-in-out both; animation-delay: 0.32s;"></span>
                        </span>
                        <style>@keyframes bounce { 0%, 80%, 100% { transform: scale(0); } 40% { transform: scale(1); } }</style>
                    </div>
                </div>`);
            messagesContainer.scrollTop = messagesContainer.scrollHeight;
            lucide.createIcons();

            try {
                const payload = {
                    chatId: currentChatId,
                    content,
                    contextMode: currentContextMode,
                    documentIds: currentContextMode === 'selected' ? Array.from(selectedDocumentIds) : []
                };

                const res = await apiFetch('/chats/message', {
                    method: 'POST',
                    body: JSON.stringify(payload)
                });

                document.getElementById(loadingId).remove();
                
                const m = res.data;
                const aiMsgHtml = renderMessageHTML({ role: 'ai', content: m.answer, sources: m.sources });
                messagesContainer.insertAdjacentHTML('beforeend', aiMsgHtml);
                
                messagesContainer.scrollTop = messagesContainer.scrollHeight;
                lucide.createIcons();
                loadChats();
            } catch (err) {
                console.error('Chat submit error:', err);
                const loadingEl = document.getElementById(loadingId);
                if (loadingEl) {
                    loadingEl.remove();
                }
                const errorHtml = `
                    <div class="msg-row ai">
                        <div class="msg-avatar ai" style="background: #FEE2E2; color: #DC2626;"><i data-lucide="alert-triangle" style="width: 18px; height: 18px;"></i></div>
                        <div class="msg-bubble ai" style="background: #FEF2F2; border: 1px solid #FECACA; color: #991B1B;">
                            <div style="font-weight: 600; margin-bottom: 4px;">AI Request Error</div>
                            <div style="font-size: 0.9rem;">${err.message || "Sorry, there was an error processing your request with the AI model."}</div>
                            <div style="margin-top: 8px;">
                                <button type="button" class="btn-retry-chat" onclick="window.retryChatMessage('${content.replace(/'/g, "\\'")}')" style="background: #DC2626; color: white; border: none; border-radius: 6px; padding: 4px 10px; font-size: 0.8rem; cursor: pointer; display: inline-flex; align-items: center; gap: 4px;">
                                    <i data-lucide="rotate-cw" style="width: 12px; height: 12px;"></i> Retry
                                </button>
                            </div>
                        </div>
                    </div>
                `;
                messagesContainer.insertAdjacentHTML('beforeend', errorHtml);
                messagesContainer.scrollTop = messagesContainer.scrollHeight;
                lucide.createIcons();
            }
        });

        window.retryChatMessage = (text) => {
            const input = document.getElementById('chat-input');
            if (input) {
                input.value = text;
                input.focus();
            }
        };

        document.addEventListener('DOMContentLoaded', async () => {
            renderSidebar();

            // Mobile toggle
            const menuBtn = document.getElementById('menu-toggle-btn');
            const sidebarEl = document.getElementById('sidebar-container');
            const overlayEl = document.getElementById('sidebar-overlay');
            if (menuBtn && sidebarEl && overlayEl) {
                menuBtn.addEventListener('click', () => {
                    sidebarEl.classList.toggle('mobile-open');
                    overlayEl.classList.toggle('mobile-open');
                });
                overlayEl.addEventListener('click', () => {
                    sidebarEl.classList.remove('mobile-open');
                    overlayEl.classList.remove('mobile-open');
                });
            }

            const contextSelect = document.getElementById('context-select');
            if (contextSelect) {
                contextSelect.addEventListener('change', (e) => {
                    currentContextMode = e.target.value;
                    if (currentContextMode === 'all') {
                        selectedDocumentIds.clear();
                        allDocuments.forEach(d => selectedDocumentIds.add(d._id.toString()));
                    }
                    renderDocumentsUI();
                    updateContextSummary();
                });
            }
            
            document.getElementById('chat-messages').innerHTML = getEmptyStateHTML();
            lucide.createIcons();

            const user = await checkAuth();
            if (user) {
                const nameEl = document.getElementById('sidebar-user-name');
                const initialEl = document.getElementById('sidebar-user-initial');
                const headerInitialEl = document.getElementById('header-user-avatar');
                if(nameEl) nameEl.innerText = user.name;
                if(initialEl) initialEl.innerText = user.name.charAt(0).toUpperCase();
                if(headerInitialEl) headerInitialEl.innerText = user.name.charAt(0).toUpperCase();
            }

            loadChats();
            loadDocumentsList();
        });
    </script>
    <script type="module" src="js/theme.js"></script>
</body>
</html>
